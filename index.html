
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<meta name="description" content="DETROITBADDIE — Say hi.">
<title>DETROITBADDIE</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  color: white;
  background: #111;
}

.page {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;

  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  text-align: center;

  padding:
    max(30px, env(safe-area-inset-top))
    20px
    max(35px, env(safe-area-inset-bottom));

  background-image:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.18),
      rgba(0,0,0,.05) 35%,
      rgba(0,0,0,.25) 60%,
      rgba(0,0,0,.65)
    ),
    url("./fansly-photo.jpeg");

  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
}

.age {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  opacity: .95;
}

.content {
  width: 100%;
  max-width: 440px;
  margin-top: auto;
  margin-bottom: 55px;
}

h1 {
  margin: 0 0 25px;
  font-size: clamp(27px, 8vw, 45px);
  font-weight: 900;
  letter-spacing: -1.5px;
  line-height: 1.1;
  text-shadow: 0 2px 20px rgba(0,0,0,.3);
}

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;

  min-width: 180px;
  padding: 18px 35px;

  background: white;
  color: black;
  border: 1px solid white;
  border-radius: 50px;

  font-size: 16px;
  font-weight: 900;
  letter-spacing: .5px;
  text-decoration: none;

  transition: transform .2s ease, background .2s ease;
}

.button:active {
  transform: scale(.97);
  background: #eee;
}

/* Clean arrow icon, not an emoji */
.arrow {
  width: 21px;
  height: 21px;
  flex-shrink: 0;
  color: black;
}

.bottom {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Minimal white outlined heart */
.heart {
  width: 29px;
  height: 29px;
  fill: none;
  stroke: white;
  stroke-width: 1.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: .95;
}

@media (min-width: 768px) {
  .page {
    background-position: center 42%;
  }
}

@media (prefers-reduced-motion: reduce) {
  .button {
    transition: none;
  }
}
</style>
</head>

<body>

<main class="page">

  <div class="age">
    18+ ONLY
  </div>

  <div class="content">

    <h1>DETROITBADDIE</h1>

    <a
      class="button"
      href="https://detroitbaddiexo.com/r/nwT3W049nl?fbclid=PAdGRleAVutWZleHRuA2FlbQIxMQBwZG9mAmZkaWQWUSqOYTcoMXNd6JtR9se8-6vzRxjHaXNydGMGYXBwX2lkDzEyNDAyNDU3NDI4NzQxNAABp_pcib_OftER14A6TFehTpClqBrtP3elEmkw3RbinMrGTuJwrJ4JnS97QwmB_aem_SmZV9sa0zRjA8xopMCKvog"
      aria-label="Say hi"
    >

      <span>SAY HI</span>

      <svg
        class="arrow"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="square"
        stroke-linejoin="miter"
        aria-hidden="true"
      >
        <path d="M5 19L19 5"/>
        <path d="M8 5H19V16"/>
      </svg>

    </a>

  </div>

  <div class="bottom">

    <svg
      class="heart"
      viewBox="0 0 24 24"
      aria-label="Heart"
      role="img"
    >
      <path
        d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
      />
    </svg>

  </div>

</main>

</body>
</html>
